[project]
name = "calcifc"
version = "0.1.0"
description = "Prototype CLI for IFC import and preliminary structural checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CalcIFC" }]

[project.scripts]
calcifc = "calcifc.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
